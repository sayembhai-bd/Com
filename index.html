<script>
    // ======================== DIRECT ENGINE - NO LOGIN, NO SPLASH ========================
    // Firebase Config (keeping for potential future but NOT used for login)
    const firebaseConfig = {
        databaseURL: "https://python-script-42d50-default-rtdb.firebaseio.com"
    };
    // Initialize Firebase only if not already (safe)
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    
    // API for draw data
    const API = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
    let lastP = null, nextP = null, targetNums = [], currentLevel = 1;
    let historyLogs = [];
    let syncInterval = null;
    let clockInterval = null;

    // Audio elements (lightweight)
    const sWin = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
    const sLoss = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');
    const sDing = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    // Preload and mute errors
    [sWin, sLoss, sDing].forEach(a => { a.volume = 0.5; a.load(); });

    // Startup: no intro, no key validation, direct engine activation
    window.onload = () => {
        // Instantly show hack section (already visible)
        startEngine();
    };

    function startEngine() {
        // start prediction cycle
        syncEngine();
        // refresh every 2 seconds for new data
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(syncEngine, 2000);
        startClock();
        
        // optional: dynamic ping simulation (cosmetic)
        setInterval(() => {
            const pingSpan = document.getElementById('pingVal');
            if (pingSpan) {
                const fakePing = Math.floor(Math.random() * 8 + 8);
                pingSpan.innerText = `PING: ${fakePing}MS`;
            }
        }, 5000);
    }

    function startClock() {
        if (clockInterval) clearInterval(clockInterval);
        clockInterval = setInterval(() => {
            const timerDiv = document.getElementById('timer');
            if (!timerDiv) return;
            // API is 30S cycle — use seconds mod 30 for correct countdown
            const nowSec = new Date().getSeconds();
            const rem = 30 - (nowSec % 30);
            const displaySec = rem < 10 ? '0' + rem : rem;
            timerDiv.innerText = `00:${displaySec}`;
            if (rem === 5) {
                sDing.play().catch(e => console.log("audio blocked"));
            }
            timerDiv.style.color = rem <= 5 ? "#ff2a5e" : (rem <= 10 ? "#ff8800" : "#00cc44");
        }, 1000);
    }

    async function syncEngine() {
        try {
            const r = await fetch(API + '?t=' + Date.now());
            const d = await r.json();
            if (!d || !d.data || !d.data.list || !d.data.list.length) return;
            const top = d.data.list[0];
            const issueNumber = top.issueNumber;
            const rawNumber = parseInt(top.number);
            if (isNaN(rawNumber)) return;
            processHybrid(issueNumber, rawNumber, d.data.list);
        } catch (e) {
            console.warn("API sync error", e);
        }
    }

    function processHybrid(p, num, list) {
        const actualLabel = num >= 5 ? "BIG" : "SMALL";
        const actualDisplay = `${actualLabel}(${num})`;
        
        // If new period arrived and we had a prediction
        if (lastP !== null && lastP !== p && nextP !== null) {
            // Determine win condition: match BIG/SMALL prediction OR hit specific numbers (targetNums)
            const isWin = (nextP === actualLabel) || targetNums.includes(num);
            
            // Play sound & adjust martingale level
            if (isWin) {
                sWin.play().catch(()=>{});
                currentLevel = 1;   // reset on win
            } else {
                sLoss.play().catch(()=>{});
                currentLevel++;
                if (currentLevel > 4) currentLevel = 1; // cap at level 4
            }
            
            // Multiplier text
            let multiplier = "1X";
            if (currentLevel === 2) multiplier = "3X";
            else if (currentLevel === 3) multiplier = "9X";
            else if (currentLevel === 4) multiplier = "27X";
            document.getElementById('mLevel').innerText = `MARTINGALE: LEVEL ${currentLevel} (${multiplier})`;
            
            // Create history entry
            const shortPeriod = p.slice(-3);
            const entry = {
                period: shortPeriod,
                pred: nextP,
                result: actualDisplay,
                status: isWin ? 'WIN' : 'LOSS',
                winClass: isWin ? 'win' : 'loss'
            };
            
            historyLogs.unshift(entry);
            if (historyLogs.length > 100) historyLogs = historyLogs.slice(0, 100);
            
            // Render new log row at top
            const row = `<tr><td>${entry.period}</td><td>${entry.pred}</td><td>${entry.result}</td><td class="${entry.winClass}">${entry.status}</td></tr>`;
            const logsContainer = document.getElementById('logs');
            logsContainer.innerHTML = row + logsContainer.innerHTML;
        }
        
        // Update last period
        lastP = p;
        
        // ----- Strategy engine: predict next outcome based on last 5 results -----
        const last5Items = list.slice(0, 5).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
        const last5Nums = list.slice(0, 5).map(x => parseInt(x.number));
        const stratDisplay = document.getElementById('stratDisplay');
        
        // DRAGON PULSE: if first three consecutive same pattern
        if (last5Items[0] === last5Items[1] && last5Items[1] === last5Items[2]) {
            nextP = last5Items[0];
            stratDisplay.innerText = "MODE: DRAGON PULSE";
        } else {
            // NEURAL REVERSE: opposite of latest
            nextP = (last5Items[0] === "BIG") ? "SMALL" : "BIG";
            stratDisplay.innerText = "MODE: NEURAL REVERSE";
        }
        
        // Compute sum of last 5 numbers for target number logic
        const sumLast5 = last5Nums.reduce((a,b) => a + b, 0);
        // Enhanced target numbers based on sum and direction
        if (nextP === "BIG") {
            targetNums = (sumLast5 > 20) ? [0, 2] : [1, 3];
        } else {
            targetNums = (sumLast5 < 25) ? [7, 9] : [6, 8];
        }
        
        // Update UI
        const nextPeriod = (BigInt(p) + 1n).toString();
        document.getElementById('pID').innerText = `PERIOD: ${nextPeriod}`;
        document.getElementById('pRes').innerText = nextP;
        document.getElementById('pRes').style.color = (nextP === "BIG") ? "#00ffff" : "#ccff00";
        
        // Update number circles
        const numRowDiv = document.getElementById('numRow');
        numRowDiv.innerHTML = `<div class="num-circle-wrap"><div class="num-circle">${targetNums[0]}</div></div><div class="num-circle-wrap"><div class="num-circle">${targetNums[1]}</div></div>`;
    }

    function clearHistory() {
        historyLogs = [];
        document.getElementById('logs').innerHTML = '';
        // Optional subtle haptic (no alert)
    }
    
    // Edge: if for some reason the element doesn't exist, fallback safety
    window.clearHistory = clearHistory;
    
    // Disable any leftover key expiry or login references
    // completely removed all login remnants
    
    // No expiry timer, no validation, no intro
    console.log("TGX PRO ENGINE ACTIVE — LOGIN REMOVED");

    // ====== TITLE PROTECTION — HACKING BOT BD ======
    const PROTECTED_TITLE = "HACKING BOT BD";

    // Lock title immediately
    document.title = PROTECTED_TITLE;

    // MutationObserver — watches <title> tag for any DOM change
    const titleObserver = new MutationObserver(() => {
        if (document.title !== PROTECTED_TITLE) {
            document.title = PROTECTED_TITLE;
        }
    });
    titleObserver.observe(
        document.querySelector('title'),
        { childList: true, characterData: true, subtree: true }
    );

    // Also lock header text in DOM — watch for any innerHTML change
    const headerObserver = new MutationObserver(() => {
        const h = document.querySelector('.header');
        if (!h) return;
        const heading = h.querySelector('span');
        if (heading && heading.textContent.trim() !== 'HACKING BOT BD') {
            heading.textContent = 'HACKING BOT BD';
        }
    });
    const headerEl = document.querySelector('.header');
    if (headerEl) {
        headerObserver.observe(headerEl, { childList: true, subtree: true, characterData: true });
    }

    // Interval double-lock every 2 seconds as backup
    setInterval(() => {
        document.title = PROTECTED_TITLE;
    }, 2000);
    // ====== END TITLE PROTECTION ======
    
    // In case there is any hidden loginSection in legacy, ensure it's gone (DOM doesn't have it)
    // But also check if any stray element? the original HTML only has hackSection now.
    // Ensure mainWrapper visible, no fade.
    document.body.style.background = "#f0f4ff";
    
    // Preload first data quickly after 300ms for smooth experience
    setTimeout(() => {
        syncEngine();
    }, 300);
    
    // Add live clock for next period countdown + optional auto-clean
    // also add performance tweak
    if ('serviceWorker' in navigator) {
        // optional, ignore
    }
    
    // periodic refresh for stats (ensure stability)
    setInterval(() => {
        // just to keep connection alive and update potential UI glitch
        const now = new Date();
        if (now.getSeconds() === 0) {
            // extra sync on minute edge
            syncEngine();
        }
    }, 15000);
    
    // Remove any leftover background/intro elements dynamically (in case hidden remnants)
    const possibleIntro = document.getElementById('introScreen');
    if (possibleIntro) possibleIntro.remove();
    
    // Force remove loginSection if present (just in case of duplicate)
    const loginDiv = document.getElementById('loginSection');
    if (loginDiv) loginDiv.remove();
    
    // Ensure hackSection is always shown
    const hack = document.getElementById('hackSection');
    if (hack) hack.classList.remove('hidden');
    
    // make timer consistent at start
    const initialRem = 60 - new Date().getSeconds();
    const initNow = new Date().getSeconds(); const initRem = 30 - (initNow % 30); document.getElementById('timer').innerText = `00:${initRem < 10 ? '0'+initRem : initRem}`;
</script>
